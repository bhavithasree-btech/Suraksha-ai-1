<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeartBeat-Home - Login 💖💚💜🧡⚙️✨</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:paleturquoise;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color:black;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 300px;
            margin: auto;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color:;
            color:paleturquoise;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #b52b70;
        }
        .signup-link {
            margin-top: 15px;
        }
        a {
            color: paleturquoise;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>HEARTBEAT-HOME 💖</h1>
    <div class="container">
        <h2>Login</h2>
        <form action="#" method="post">
            <input type="text" placeholder="Username" name="username" required><br>
            <input type="password" placeholder="Password" name="password" required><br>
            <button type="submit">Login</button>
        </form>
        <div class="signup-link">
            <p>Don't Have an Account? <a href="sign up2.html">Sign Up</a></p>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
